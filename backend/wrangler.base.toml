# Base Worker config. NOT used directly for deploys: scripts/gen-wrangler.mjs reads this file, adds
# MASTER_DB + one D1 per agency + [vars], and writes .wrangler.<env>.toml (gitignored). Wrangler does not
# inherit bindings into [env.*], so the generator repeats every binding in a complete [env.<name>] section.
# KV ids below are placeholders; gen-wrangler fills them from CF_KV_CACHE_ID, CF_KV_SESSIONS_ID,
# CF_KV_REPORT_CACHE_ID, and MASTER_DB from CF_D1_MASTER_ID. predeploy-guard refuses to deploy the placeholder ids.
name = "travelcrm-api"
main = "src/index.ts"
compatibility_date = "2026-02-20"
compatibility_flags = ["nodejs_compat"]

# --- D1 Databases ---
# Generated by scripts/gen-wrangler.mjs: MASTER_DB (migrations_dir drizzle/master) and one
# [[d1_databases]] per agency in the registry. Never add D1 bindings here.

# --- R2 Buckets ---
[[r2_buckets]]
binding = "FILE_STORAGE"
bucket_name = "travelcrm-files"

# --- KV Namespaces ---
[[kv_namespaces]]
binding = "CACHE"
id = "a0000000-0000-0000-0000-000000000002"

[[kv_namespaces]]
binding = "SESSIONS"
id = "a0000000-0000-0000-0000-000000000003"

[[kv_namespaces]]
binding = "REPORT_CACHE"
id = "a0000000-0000-0000-0000-000000000004"

# --- Email sending (Cloudflare Email Service, public beta) ---
# Platform system mail only, and only when EMAIL_SYSTEM_PROVIDER=cloudflare (default sendgrid). Never add remote = true:
# a remote binding sends real mail from wrangler dev. Agency mail and marketing never use this binding.
[[send_email]]
name = "EMAIL"

# --- Rate limiting (Workers Rate Limiting binding; needs wrangler >= 4.36) ---
# Counted at the edge, no KV traffic. period must be 10 or 60 seconds. Limits are per Cloudflare location and
# eventually consistent. namespace_id is a positive integer string, unique in the account.
# https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "UPLOAD_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# --- Queues (Producers) ---
[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "travelcrm-email-queue"

[[queues.producers]]
binding = "SMS_QUEUE"
queue = "travelcrm-sms-queue"

[[queues.producers]]
binding = "PUSH_NOTIFICATION_QUEUE"
queue = "travelcrm-push-queue"

[[queues.producers]]
binding = "WP_PROVISION_QUEUE"
queue = "travelcrm-wp-provision-queue"

# --- Queues (Consumers) ---
[[queues.consumers]]
queue = "travelcrm-email-queue"
max_batch_size = 10
max_batch_timeout = 30

[[queues.consumers]]
queue = "travelcrm-sms-queue"
max_batch_size = 10
max_batch_timeout = 30

[[queues.consumers]]
queue = "travelcrm-push-queue"
max_batch_size = 10
max_batch_timeout = 30

[[queues.consumers]]
queue = "travelcrm-wp-provision-queue"
max_batch_size = 1
max_batch_timeout = 30

[[queues.producers]]
binding = "IMPORT_QUEUE"
queue = "travelcrm-import-queue"

[[queues.producers]]
binding = "EXPORT_QUEUE"
queue = "travelcrm-export-queue"

[[queues.consumers]]
queue = "travelcrm-import-queue"
max_batch_size = 1 # process 1 chunk at a time per invocation
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "travelcrm-import-dlq"

[[queues.consumers]]
queue = "travelcrm-export-queue"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "travelcrm-export-dlq"

[[queues.producers]]
binding = "IMPORT_DL_QUEUE"
queue = "travelcrm-import-dlq"

[[queues.producers]]
binding = "EXPORT_DL_QUEUE"
queue = "travelcrm-export-dlq"

[[queues.producers]]
binding = "CAMPAIGN_QUEUE"
queue = "travelcrm-campaign-queue"

[[queues.consumers]]
queue = "travelcrm-campaign-queue"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "travelcrm-campaign-dlq"

[[queues.producers]]
binding = "CAMPAIGN_DL_QUEUE"
queue = "travelcrm-campaign-dlq"

[[queues.producers]]
binding = "AI_EXTRACTION_QUEUE"
queue = "travelcrm-ai-extraction-queue"

[[queues.producers]]
binding = "AI_EXTRACTION_DLQ"
queue = "travelcrm-ai-extraction-dlq"

[[queues.consumers]]
queue = "travelcrm-ai-extraction-queue"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "travelcrm-ai-extraction-dlq"

# Per-agency job fan-out (cron/dispatch.ts produces, queues/tenant-jobs-queue.ts consumes)
[[queues.producers]]
binding = "TENANT_JOBS_QUEUE"
queue = "travelcrm-tenant-jobs"

[[queues.consumers]]
queue = "travelcrm-tenant-jobs"
max_batch_size = 5
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "travelcrm-tenant-jobs-dlq"

# --- Cron Triggers ---
[triggers]
crons = ["*/5 * * * *", "0 * * * *", "30 0 * * *"]

# --- Workers AI ---
[ai]
binding = "AI"

# --- Durable Objects ---
[durable_objects]
bindings = [
  { name = "REALTIME", class_name = "RealtimeRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["RealtimeRoom"]

# --- Observability ---
[observability]
enabled = true
head_sampling_rate = 1
