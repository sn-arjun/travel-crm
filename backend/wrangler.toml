name = "travelcrm-api"
main = "src/index.ts"
compatibility_date = "2026-02-20"
compatibility_flags = ["nodejs_compat"]

# --- D1 Databases ---
[[d1_databases]]
binding = "MASTER_DB"
database_name = "travelcrm-master"
database_id = "a0000000-0000-0000-0000-000000000001" # Replace with real Terraform ID before deploying
migrations_dir = "drizzle/tenant"

# --- R2 Buckets ---
[[r2_buckets]]
binding = "FILE_STORAGE"
bucket_name = "travelcrm-files"

# --- KV Namespaces ---
[[kv_namespaces]]
binding = "CACHE"
id = "a0000000-0000-0000-0000-000000000002"

[[kv_namespaces]]
binding = "SESSIONS"
id = "a0000000-0000-0000-0000-000000000003"

[[kv_namespaces]]
binding = "REPORT_CACHE"
id = "a0000000-0000-0000-0000-000000000004"

# --- Queues (Producers) ---
[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "travelcrm-email-queue"

[[queues.producers]]
binding = "SMS_QUEUE"
queue = "travelcrm-sms-queue"

[[queues.producers]]
binding = "PUSH_NOTIFICATION_QUEUE"
queue = "travelcrm-push-queue"

[[queues.producers]]
binding = "WP_PROVISION_QUEUE"
queue = "travelcrm-wp-provision-queue"

# --- Queues (Consumers) ---
[[queues.consumers]]
queue = "travelcrm-email-queue"
max_batch_size = 10
max_batch_timeout = 30

[[queues.consumers]]
queue = "travelcrm-sms-queue"
max_batch_size = 10
max_batch_timeout = 30

[[queues.consumers]]
queue = "travelcrm-push-queue"
max_batch_size = 10
max_batch_timeout = 30

[[queues.consumers]]
queue = "travelcrm-wp-provision-queue"
max_batch_size = 1
max_batch_timeout = 30

[[queues.producers]]
binding = "IMPORT_QUEUE"
queue = "travelcrm-import-queue"

[[queues.producers]]
binding = "EXPORT_QUEUE"
queue = "travelcrm-export-queue"

[[queues.consumers]]
queue = "travelcrm-import-queue"
max_batch_size = 1 # process 1 chunk at a time per invocation
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "travelcrm-import-dlq"

[[queues.consumers]]
queue = "travelcrm-export-queue"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "travelcrm-export-dlq"

[[queues.producers]]
binding = "IMPORT_DL_QUEUE"
queue = "travelcrm-import-dlq"

[[queues.producers]]
binding = "EXPORT_DL_QUEUE"
queue = "travelcrm-export-dlq"

[[queues.producers]]
binding = "CAMPAIGN_QUEUE"
queue = "travelcrm-campaign-queue"

[[queues.consumers]]
queue = "travelcrm-campaign-queue"
max_batch_size = 1
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "travelcrm-campaign-dlq"

[[queues.producers]]
binding = "CAMPAIGN_DL_QUEUE"
queue = "travelcrm-campaign-dlq"

# --- Cron Triggers ---
[triggers]
crons = ["*/5 * * * *"]

# --- Durable Objects ---
[durable_objects]
bindings = [
  { name = "REALTIME", class_name = "RealtimeRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["RealtimeRoom"]

# --- Environment Variables (set via wrangler secret) ---
# JWT_SECRET, JWT_REFRESH_SECRET, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN,
# SENDGRID_API_KEY, FCM_SERVER_KEY

# --- Dev Environment ---
[env.dev]
name = "travelcrm-api-dev"

# --- Staging Environment ---
[env.staging]
name = "travelcrm-api-staging"

# --- Production Environment ---
[env.production]
name = "travelcrm-api"
