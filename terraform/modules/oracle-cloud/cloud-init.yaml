#cloud-config
# First boot of the shared WordPress VM: Docker, firewall and the data folders. The stack itself
# (WordPress Multisite, MariaDB, Caddy, provisioner) is started afterwards from
# oci-provisioner/docker-compose.shared.yml (docs/ops/WORDPRESS-HOSTING.md, "Go-live on the VM").

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - unzip
  - git
  - iptables-persistent

runcmd:
  # --- Docker (get.docker.com installs the compose plugin too) ---
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu

  # --- Firewall: Oracle's Ubuntu images block everything but SSH by default ---
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - netfilter-persistent save

  # --- Swap: a safety net against the out-of-memory killer when a plugin update spikes ---
  - fallocate -l 4G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # --- Data folders used by docker-compose.shared.yml (WP_DATA_DIR) ---
  - mkdir -p /opt/wp-shared/db /opt/wp-shared/html /opt/wp-shared/provisioner /opt/wp-shared/backups /opt/wp-shared/stack
  - chown -R ubuntu:ubuntu /opt/wp-shared/stack /opt/wp-shared/backups

  # --- Pull the images once so the first start is quick ---
  - docker pull mariadb:10.11
  - docker pull wordpress:6-php8.2-apache
  - docker pull caddy:2
