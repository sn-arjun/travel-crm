# electron-builder configuration
# Docs: https://www.electron.build/configuration

appId: com.travelcrm.desktop
productName: TravelCRM Pro
copyright: Copyright © 2026 TravelCRM

directories:
  output: release
  buildResources: public

files:
  - electron/dist/**
  - .next/**
  - public/**
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.ico

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: public/icon.icns
  category: public.app-category.business

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: public/icon.png
  category: Office

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

publish:
  provider: github
  owner: your-org
  repo: travel-crm
