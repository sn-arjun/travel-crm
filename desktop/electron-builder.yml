# electron-builder configuration
# Docs: https://www.electron.build/configuration

appId: com.travelcrm.desktop
productName: TravelCRM Pro
copyright: Copyright © 2026 TravelCRM

directories:
  output: release
  buildResources: build-resources

files:
  - electron/dist/**
  - package.json

# The Next standalone server must run from real files, so it ships outside the asar.
extraResources:
  - from: .next/standalone
    to: app-server
  - from: build-resources/tray.png
    to: tray.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build-resources/icon.png

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build-resources/icon.png
  category: public.app-category.business

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build-resources/icon.png
  category: Office

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# Update feed: a generic provider (R2 bucket behind downloads.<domain> at go-live).
# Set TRAVELCRM_UPDATE_URL when building; the packaged app also reads it at runtime.
publish:
  provider: generic
  url: ${env.TRAVELCRM_UPDATE_URL}
