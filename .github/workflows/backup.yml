name: Weekly backup

# Sunday 02:00 UTC, and on demand from the Actions tab. Dumps the master database and every agency database
# (backend/scripts/backup-tenants.mjs) and uploads the gzipped dumps to the R2 bucket travelcrm-backups.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (D1 read, R2 write), CLOUDFLARE_ACCOUNT_ID, CF_D1_MASTER_ID
# and the repository variable TRAVELCRM_DOMAIN. See docs/ops/BACKUPS.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be backed up without exporting or uploading'
        type: boolean
        default: false
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  backup:
    name: Dump every database and upload to R2
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_MASTER_ID: ${{ secrets.CF_D1_MASTER_ID }}
      DOMAIN: ${{ vars.TRAVELCRM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Generate the production config from the agency registry
        run: node scripts/gen-wrangler.mjs --env production --from-d1-remote
        working-directory: backend
      - name: Back up (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/backup-tenants.mjs --remote --env production --dry-run
        working-directory: backend
      - name: Back up and upload to R2
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: node scripts/backup-tenants.mjs --remote --env production --bucket travelcrm-backups --out "$RUNNER_TEMP/backup"
        working-directory: backend
