name: Deploy Backend API

# Manual only. Production deploys follow the runbook.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Migrate (canary first) and deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_MASTER_ID: ${{ secrets.CF_D1_MASTER_ID }}
      CF_KV_CACHE_ID: ${{ secrets.CF_KV_CACHE_ID }}
      CF_KV_SESSIONS_ID: ${{ secrets.CF_KV_SESSIONS_ID }}
      CF_KV_REPORT_CACHE_ID: ${{ secrets.CF_KV_REPORT_CACHE_ID }}
      DOMAIN: ${{ vars.TRAVELCRM_DOMAIN }}
      APP_URL: ${{ vars.APP_URL }}
      API_URL: ${{ vars.API_URL }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      # Every plain setting backend/scripts/gen-wrangler.mjs reads, from GitHub repository variables (Settings, Variables),
      # so a CI deploy writes the same [vars] as a manual one. An unset variable is an empty string: the generator then uses
      # its default (or omits the optional setting). SECRETS ARE NOT PASSED: scripts/push-secrets.sh pushes them separately.
      # TEST_MODE, BILLING_GATEWAY and VOIP_PROVIDER are deliberately not listed (the generator refuses them for production).
      EMAIL_SYSTEM_PROVIDER: ${{ vars.EMAIL_SYSTEM_PROVIDER }}
      EMAIL_INBOUND_DOMAIN: ${{ vars.EMAIL_INBOUND_DOMAIN }}
      EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
      PLATFORM_SUPPORT_EMAIL: ${{ vars.PLATFORM_SUPPORT_EMAIL }}
      QUOTES_URL: ${{ vars.QUOTES_URL }}
      PUBLIC_PAGES_URL: ${{ vars.PUBLIC_PAGES_URL }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      ALLOW_LOOPBACK_ORIGINS: ${{ vars.ALLOW_LOOPBACK_ORIGINS }}
      CREDENTIALS_ACTIVE_KEY_ID: ${{ vars.CREDENTIALS_ACTIVE_KEY_ID }}
      SUPER_ADMIN_EMAIL: ${{ vars.SUPER_ADMIN_EMAIL }}
      PLATFORM_TAX_COUNTRY: ${{ vars.PLATFORM_TAX_COUNTRY }}
      PLATFORM_TAX_STATE: ${{ vars.PLATFORM_TAX_STATE }}
      PLATFORM_TAX_ID: ${{ vars.PLATFORM_TAX_ID }}
      PLATFORM_GST_RATE: ${{ vars.PLATFORM_GST_RATE }}
      PLATFORM_VAT_COUNTRIES: ${{ vars.PLATFORM_VAT_COUNTRIES }}
      PLATFORM_VAT_RATE: ${{ vars.PLATFORM_VAT_RATE }}
      BILLING_GRACE_DAYS: ${{ vars.BILLING_GRACE_DAYS }}
      VOIP_CALLING_COUNTRIES: ${{ vars.VOIP_CALLING_COUNTRIES }}
      WHATSAPP_META_GRAPH_VERSION: ${{ vars.WHATSAPP_META_GRAPH_VERSION }}
      WHATSAPP_META_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_META_PHONE_NUMBER_ID }}
      OCI_PROVISIONER_URL: ${{ vars.OCI_PROVISIONER_URL }}
      WP_SITES_DOMAIN: ${{ vars.WP_SITES_DOMAIN }}
      DAILY_JOB_HOUR: ${{ vars.DAILY_JOB_HOUR }}
      APP_VERSION: ${{ vars.APP_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm -w @travelcrm/shared run build
      - run: npm -w travelcrm-api run typecheck
      - name: Generate the production wrangler config from the agency registry
        run: npm -w travelcrm-api run gen:wrangler -- --env production --from-d1-remote
      - name: Migrate master and agency databases (canary first)
        run: node scripts/migrate-tenants.mjs --remote --env production
        working-directory: backend
      - name: Deploy (predeploy guard runs first)
        run: npm -w travelcrm-api run deploy:production
      - name: Health check
        run: |
          sleep 10
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.API_URL }}/api/v1/health"
