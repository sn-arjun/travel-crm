name: Deploy Super Admin Portal

# Manual only. Production deploys follow the runbook.
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy the OpenNext Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm -w @travelcrm/shared run build
      - name: Deploy (opennextjs-cloudflare build + deploy)
        run: npm -w super-admin run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
