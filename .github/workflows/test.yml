name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm -w @travelcrm/shared run build
      - run: npm -w travelcrm-api run typecheck
      - run: npm -w travelcrm-api exec -- vitest run

  super-admin:
    name: Super admin (tsc, lint, next build, OpenNext build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm -w @travelcrm/shared run build
      - run: npx tsc --noEmit
        working-directory: super-admin
      - run: npm -w super-admin run lint
      - run: npm -w super-admin run build
      - name: OpenNext (Cloudflare) build
        run: npx opennextjs-cloudflare build
        working-directory: super-admin
      - name: Check worker output
        run: test -f super-admin/.open-next/worker.js
