name: Desktop CI

on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'packages/shared-ts/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'packages/shared-ts/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:
    inputs:
      package:
        description: 'Build unsigned installers (Windows NSIS, macOS DMG, Linux)'
        type: boolean
        default: false

jobs:
  check:
    name: Lint gate, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm -w @travelcrm/shared run build
      - name: Lint gate
        run: node desktop/scripts/lint-gate.mjs
      - run: npm -w travelcrm-desktop run typecheck
      - run: npm -w travelcrm-desktop run test
      - name: Next build
        run: npm -w travelcrm-desktop run build
        env:
          NODE_ENV: production

  package:
    name: Package (${{ matrix.os }})
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm -w @travelcrm/shared run build
      - name: Build unsigned installer
        run: npm -w travelcrm-desktop run build:desktop
        env:
          NODE_ENV: production
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: desktop/release/*
          retention-days: 7
