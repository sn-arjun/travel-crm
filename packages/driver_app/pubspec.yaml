name: driver_app
description: "TravelCRM Pro — Driver Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared package
  shared:
    path: ../shared

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # UI
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8

  # Internationalization
  intl: ^0.20.2

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Location
  geolocator: ^13.0.2

  # Camera
  image_picker: ^1.1.2

  # Networking
  dio: ^5.7.0

  # Maps
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5

flutter:
  generate: true
  uses-material-design: true
