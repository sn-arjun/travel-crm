name: crm_app
description: "TravelCRM Pro — Tours & Travels CRM Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared package
  shared:
    path: ../shared

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # UI
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Internationalization
  intl: ^0.20.2

  # Secure Storage (native only; web uses dart:js_interop + package:web localStorage)
  flutter_secure_storage: ^9.2.4
  web: ^1.1.1

  # Networking
  dio: ^5.7.0

  # Rich text editor
  flutter_quill: ^11.5.0

  # Biometric auth
  local_auth: ^2.3.0
  shared_preferences: ^2.3.5

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.3

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.4

  # Utils
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  file_picker: ^8.0.0+1
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  http: ^1.6.0
  table_calendar: ^3.2.0
  fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  patrol: ^4.1.1

flutter:
  generate: true
  uses-material-design: true

msix_config:
  display_name: TravelCRM Pro
  publisher_display_name: TravelCRM
  identity_name: com.travelcrm.pro
  msix_version: 1.0.0.0
  logo_path: assets/icons/app_icon.png
  capabilities: internetClient, microphone, webcam
  languages: en-us, hi-in
